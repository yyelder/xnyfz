      <line x1="-12" y1="-12" x2="12" y2="12" stroke="#8a6208" stroke-width="1.8" stroke-linecap="round" />
      <line x1="-12" y1="12" x2="12" y2="-12" stroke="#8a6208" stroke-width="1.8" stroke-linecap="round" />
    </g>
        <text x="654" y="334" font-size="13" font-weight="700" fill="#182635" text-anchor="start" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">EL</text>
        
        
        
      </g></g>
  <g class="annotations"><text x="340" y="120" font-size="12" font-weight="500" fill="#1a5fb4" text-anchor="start" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">两段导线标号同为 101 → 电气上同一点（省去长距离连线）</text></g>
  
</svg>