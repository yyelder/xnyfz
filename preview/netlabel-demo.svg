<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <pattern id="gridMinor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e6ecf4" stroke-width="1"/>
    </pattern>
    <pattern id="gridMajor" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#gridMinor)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#d5dfea" stroke-width="1.2"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1b2a3a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="900" height="520" fill="#f8fafc"/>
  <rect x="0" y="0" width="900" height="520" fill="url(#gridMajor)"/>
  <g class="wires"><g class="wire" data-net="L" style="cursor:default"><line x1="120" y1="80" x2="220" y2="80" stroke="#d63a3a" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="200" y1="148" x2="200" y2="80" stroke="#d63a3a" stroke-width="3" stroke-linecap="round" opacity="1"/><circle cx="200" cy="80" r="2.55" fill="#d63a3a" opacity="1"/></g><g class="wire" data-net="n-1" style="cursor:default"><line x1="200" y1="210" x2="200" y2="300" stroke="#d63a3a" stroke-width="2.3" stroke-linecap="round" opacity="1"/><circle cx="200" cy="212" r="1.9549999999999998" fill="#d63a3a" opacity="1"/><circle cx="200" cy="300" r="1.9549999999999998" fill="#d63a3a" opacity="1"/></g><g class="wire" data-net="n-2" style="cursor:default"><line x1="620" y1="300" x2="620" y2="294" stroke="#d63a3a" stroke-width="2.3" stroke-linecap="round" opacity="1"/><circle cx="620" cy="294" r="1.9549999999999998" fill="#d63a3a" opacity="1"/></g><g class="wire" data-net="n-3" style="cursor:default"><line x1="200" y1="360" x2="200" y2="430" stroke="#d63a3a" stroke-width="2.3" stroke-linecap="round" opacity="1"/><line x1="200" y1="430" x2="620" y2="430" stroke="#d63a3a" stroke-width="2.3" stroke-linecap="round" opacity="1"/><line x1="620" y1="430" x2="620" y2="366" stroke="#d63a3a" stroke-width="2.3" stroke-linecap="round" opacity="1"/><circle cx="200" cy="360" r="1.9549999999999998" fill="#d63a3a" opacity="1"/><circle cx="620" cy="366" r="1.9549999999999998" fill="#d63a3a" opacity="1"/></g><g class="wire" data-net="N" style="cursor:default"><line x1="120" y1="470" x2="760" y2="470" stroke="#2f6fb5" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="620" y1="366" x2="620" y2="470" stroke="#2f6fb5" stroke-width="3" stroke-linecap="round" opacity="1"/><circle cx="620" cy="470" r="2.55" fill="#2f6fb5" opacity="1"/></g></g>
  <g class="wire-labels"><text x="120" y="68" font-size="12" font-weight="600" fill="#d63a3a" text-anchor="start" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">L 220V</text>
    <g class="net-flag" data-net="n-1" style="cursor:pointer">
      <line x1="200" y1="210" x2="205" y2="210" stroke="#d63a3a" stroke-width="1" opacity="0.85"/>
      <rect x="205" y="190" width="35.6" height="17" rx="3" fill="#ffffff" stroke="#d63a3a" stroke-width="1.2"/>
      <text x="222.8" y="202.5" font-size="11" font-weight="700" fill="#d63a3a" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">101</text>
    </g>
    <g class="net-flag" data-net="n-2" style="cursor:pointer">
      <line x1="620" y1="300" x2="625" y2="300" stroke="#d63a3a" stroke-width="1" opacity="0.85"/>
      <rect x="625" y="280" width="35.6" height="17" rx="3" fill="#ffffff" stroke="#d63a3a" stroke-width="1.2"/>
      <text x="642.8" y="292.5" font-size="11" font-weight="700" fill="#d63a3a" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">101</text>
    </g><text x="120" y="492" font-size="12" font-weight="600" fill="#2f6fb5" text-anchor="start" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">N</text></g>
  <g class="devices">
      <g class="dev" data-dev="QF1" style="cursor:pointer">
        
        
