<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 830" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <pattern id="gridMinor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e6ecf4" stroke-width="1"/>
    </pattern>
    <pattern id="gridMajor" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#gridMinor)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#d5dfea" stroke-width="1.2"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1b2a3a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1280" height="830" fill="#f8fafc"/>
  <rect x="0" y="0" width="1280" height="830" fill="url(#gridMajor)"/>
  <g class="wires"><g class="wire" data-net="L" style="cursor:default"><line x1="140" y1="90" x2="1140" y2="90" stroke="#d63a3a" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="420" y1="148" x2="420" y2="90" stroke="#d63a3a" stroke-width="3" stroke-linecap="round" opacity="1"/><circle cx="420" cy="90" r="2.55" fill="#d63a3a" opacity="1"/></g><g class="wire" data-net="n-qf" style="cursor:default"><line x1="300" y1="284" x2="700" y2="284" stroke="#d63a3a" stroke-width="2.3" stroke-linecap="round" opacity="1"/><line x1="420" y1="212" x2="420" y2="284" stroke="#d63a3a" stroke-width="2.3" stroke-linecap="round" opacity="1"/><line x1="300" y1="320" x2="300" y2="284" stroke="#d63a3a" stroke-width="2.3" stroke-linecap="round" opacity="1"/><line x1="700" y1="320" x2="700" y2="284" stroke="#d63a3a" stroke-width="2.3" stroke-linecap="round" opacity="1"/><circle cx="420" cy="284" r="1.9549999999999998" fill="#d63a3a" opacity="1"/><circle cx="300" cy="284" r="1.9549999999999998" fill="#d63a3a" opacity="1"/><circle cx="700" cy="284" r="1.9549999999999998" fill="#d63a3a" opacity="1"/></g><g class="wire" data-net="n-el1" style="cursor:default"><line x1="300" y1="380" x2="300" y2="564" stroke="#d63a3a" stroke-width="2.3" stroke-linecap="round" opacity="1"/></g><g class="wire" data-net="n-el2" style="cursor:default"><line x1="700" y1="380" x2="700" y2="564" stroke="#d63a3a" stroke-width="2.3" stroke-linecap="round" opacity="1"/></g><g class="wire" data-net="N" style="cursor:default"><line x1="140" y1="740" x2="1140" y2="740" stroke="#2f6fb5" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="300" y1="636" x2="300" y2="740" stroke="#2f6fb5" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="700" y1="636" x2="700" y2="740" stroke="#2f6fb5" stroke-width="3" stroke-linecap="round" opacity="1"/><circle cx="300" cy="740" r="2.55" fill="#2f6fb5" opacity="1"/><circle cx="700" cy="740" r="2.55" fill="#2f6fb5" opacity="1"/></g></g>
  <g class="wire-labels"><text x="140" y="80" font-size="12" font-weight="600" fill="#d63a3a" text-anchor="start" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">L（相线）220V</text><text x="140" y="762" font-size="12" font-weight="600" fill="#2f6fb5" text-anchor="start" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">N（零线）</text></g>
  <g class="devices">
      <g class="dev" data-dev="QF1" style="cursor:pointer">
        
        
        <g transform="translate(420 180) rotate(0)">
