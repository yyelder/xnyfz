      <g transform="rotate(0 0 12)"><line x1="0" y1="12" x2="0" y2="-11" stroke="#182635" stroke-width="2.8" stroke-linecap="round" /></g>
    </g>
        <text x="314" y="354" font-size="13" font-weight="700" fill="#182635" text-anchor="start" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">SA1</text>
        <circle cx="300" cy="320" r="3" fill="#f8fafc" stroke="#41556b" stroke-width="1.2" class="pin" data-pin="SA1:1"/><circle cx="300" cy="380" r="3" fill="#f8fafc" stroke="#41556b" stroke-width="1.2" class="pin" data-pin="SA1:2"/>
        
        
      </g>
      <g class="dev" data-dev="EL1" style="cursor:pointer">
        
        
        <g transform="translate(300 600) rotate(0)">
      <line x1="0" y1="-36" x2="0" y2="-20" stroke="#d98218" stroke-width="2.2" stroke-linecap="round" />
      <line x1="0" y1="20" x2="0" y2="36" stroke="#d98218" stroke-width="2.2" stroke-linecap="round" />
