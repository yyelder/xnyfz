      <circle cx="0" cy="-13" r="2.3" fill="#182635"/>
      <g transform="rotate(0 0 13)"><line x1="0" y1="13" x2="0" y2="-12" stroke="#182635" stroke-width="2.6" stroke-linecap="round" /></g>
      <rect x="5" y="-19" width="7" height="7" rx="0" fill="none" stroke="#182635" stroke-width="1.2"/>
    </g>
        <text x="434" y="184" font-size="13" font-weight="700" fill="#182635" text-anchor="start" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">QF1</text>
        <circle cx="420" cy="148" r="3" fill="#f8fafc" stroke="#41556b" stroke-width="1.2" class="pin" data-pin="QF1:1"/><circle cx="420" cy="212" r="3" fill="#f8fafc" stroke="#41556b" stroke-width="1.2" class="pin" data-pin="QF1:2"/>
        
        
      </g>
      <g class="dev" data-dev="SA1" style="cursor:pointer">
        
        
        <g transform="translate(300 350) rotate(0)">
      <line x1="0" y1="-30" x2="0" y2="-12" stroke="#182635" stroke-width="2.2" stroke-linecap="round" />
      <line x1="0" y1="12" x2="0" y2="30" stroke="#182635" stroke-width="2.2" stroke-linecap="round" />
      <circle cx="0" cy="-12" r="2.4" fill="#182635"/>
