      <line x1="-12" y1="12" x2="12" y2="-12" stroke="#8a6208" stroke-width="1.8" stroke-linecap="round" />
    </g>
        <text x="334" y="604" font-size="13" font-weight="700" fill="#182635" text-anchor="start" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">EL1</text>
        <circle cx="300" cy="564" r="3" fill="#f8fafc" stroke="#41556b" stroke-width="1.2" class="pin" data-pin="EL1:1"/><circle cx="300" cy="636" r="3" fill="#f8fafc" stroke="#41556b" stroke-width="1.2" class="pin" data-pin="EL1:2"/>
        
        
      </g>
      <g class="dev" data-dev="SA2" style="cursor:pointer">
        
        
        <g transform="translate(700 350) rotate(0)">
      <line x1="0" y1="-30" x2="0" y2="-12" stroke="#182635" stroke-width="2.2" stroke-linecap="round" />
      <line x1="0" y1="12" x2="0" y2="30" stroke="#182635" stroke-width="2.2" stroke-linecap="round" />
      <circle cx="0" cy="-12" r="2.4" fill="#182635"/>
      <circle cx="0" cy="12" r="2.4" fill="#182635"/>
      <g transform="rotate(0 0 12)"><line x1="0" y1="12" x2="0" y2="-11" stroke="#182635" stroke-width="2.8" stroke-linecap="round" /></g>
    </g>
        <text x="714" y="354" font-size="13" font-weight="700" fill="#182635" text-anchor="start" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">SA2</text>
        <circle cx="700" cy="320" r="3" fill="#f8fafc" stroke="#41556b" stroke-width="1.2" class="pin" data-pin="SA2:1"/><circle cx="700" cy="380" r="3" fill="#f8fafc" stroke="#41556b" stroke-width="1.2" class="pin" data-pin="SA2:2"/>
        
        
      </g>
      <g class="dev" data-dev="EL2" style="cursor:pointer">
        
        
        <g transform="translate(700 600) rotate(0)">
      <line x1="0" y1="-36" x2="0" y2="-20" stroke="#d98218" stroke-width="2.2" stroke-linecap="round" />
      <line x1="0" y1="20" x2="0" y2="36" stroke="#d98218" stroke-width="2.2" stroke-linecap="round" />
      <circle cx="0" cy="0" r="34" fill="rgba(245,195,59,.45)"/>
      <circle cx="0" cy="0" r="20" fill="#f5c33b" stroke="#b8860b" stroke-width="2.2"/>
      <line x1="-12" y1="-12" x2="12" y2="12" stroke="#8a6208" stroke-width="1.8" stroke-linecap="round" />
      <line x1="-12" y1="12" x2="12" y2="-12" stroke="#8a6208" stroke-width="1.8" stroke-linecap="round" />
    </g>
        <text x="734" y="604" font-size="13" font-weight="700" fill="#182635" text-anchor="start" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">EL2</text>
        <circle cx="700" cy="564" r="3" fill="#f8fafc" stroke="#41556b" stroke-width="1.2" class="pin" data-pin="EL2:1"/><circle cx="700" cy="636" r="3" fill="#f8fafc" stroke="#41556b" stroke-width="1.2" class="pin" data-pin="EL2:2"/>
        
        
      </g></g>
  <g class="annotations"><text x="300" y="780" font-size="12" font-weight="500" fill="#41556b" text-anchor="start" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">① 合上 QF1 后，L 母线带电（红色）</text><text x="300" y="800" font-size="12" font-weight="500" fill="#41556b" text-anchor="start" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">② 开关串接在相线上，控制灯的通断</text><text x="700" y="780" font-size="12" font-weight="500" fill="#41556b" text-anchor="start" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">③ 两路灯并联，互不影响</text></g>
  
</svg>