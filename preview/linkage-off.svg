<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">
