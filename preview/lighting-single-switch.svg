  <g class="notes"></g>
  <g class="annotations"><text x="300" y="780" font-size="12" font-weight="500" fill="#41556b" text-anchor="start" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">① 合上 QF1 后，L 母线带电（红色）</text><text x="300" y="800" font-size="12" font-weight="500" fill="#41556b" text-anchor="start" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">② 开关串接在相线上，控制灯的通断</text><text x="700" y="780" font-size="12" font-weight="500" fill="#41556b" text-anchor="start" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">③ 两路灯并联，互不影响</text></g>
  
</svg>