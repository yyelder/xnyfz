        <text x="266" y="604" font-size="16" font-weight="700" fill="#182635" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" data-dev-label="EL1" data-label-drag="EL1" style="cursor:move">EL1</text>
        <circle cx="300" cy="564" r="3" fill="#f9fbff" stroke="#41556b" stroke-width="1.2" class="pin" data-pin="EL1:1"/><circle cx="300" cy="636" r="3" fill="#f9fbff" stroke="#41556b" stroke-width="1.2" class="pin" data-pin="EL1:2"/>
        
        
      </g>
      <g class="dev" data-dev="SA2" style="cursor:pointer">
        <g transform="translate(700 350) rotate(0)"><line x1="0" y1="-30" x2="0" y2="-12" stroke="#182635" stroke-width="2.2" stroke-linecap="round" /><line x1="0" y1="12" x2="0" y2="30" stroke="#182635" stroke-width="2.2" stroke-linecap="round" /><circle cx="0" cy="-12" r="2.4" fill="#182635"/><circle cx="0" cy="12" r="2.4" fill="#182635"/><g transform="rotate(-30 0 12)"><line x1="0" y1="12" x2="0" y2="-11" stroke="#182635" stroke-width="2.8" stroke-linecap="round" /></g></g>
        
        <text x="686" y="354" font-size="16" font-weight="700" fill="#182635" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" data-dev-label="SA2" data-label-drag="SA2" style="cursor:move">SA2</text>
        <circle cx="700" cy="320" r="3" fill="#f9fbff" stroke="#41556b" stroke-width="1.2" class="pin" data-pin="SA2:1"/><circle cx="700" cy="380" r="3" fill="#f9fbff" stroke="#41556b" stroke-width="1.2" class="pin" data-pin="SA2:2"/>
        
        
      </g>
