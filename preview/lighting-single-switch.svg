        <circle cx="300" cy="320" r="3" fill="#f9fbff" stroke="#41556b" stroke-width="1.2" class="pin" data-pin="SA1:1"/><circle cx="300" cy="380" r="3" fill="#f9fbff" stroke="#41556b" stroke-width="1.2" class="pin" data-pin="SA1:2"/>
        
        
