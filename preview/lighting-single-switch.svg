        <g transform="translate(700 600) rotate(0)"><line x1="0" y1="-36" x2="0" y2="-20" stroke="#182635" stroke-width="2.2" stroke-linecap="round" /><line x1="0" y1="20" x2="0" y2="36" stroke="#182635" stroke-width="2.2" stroke-linecap="round" /><circle cx="0" cy="0" r="20" fill="#ffffff" stroke="#182635" stroke-width="2.2"/><line x1="-12" y1="-12" x2="12" y2="12" stroke="#182635" stroke-width="1.8" stroke-linecap="round" /><line x1="-12" y1="12" x2="12" y2="-12" stroke="#182635" stroke-width="1.8" stroke-linecap="round" /></g>
        
        <text x="666" y="604" font-size="16" font-weight="700" fill="#182635" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" data-dev-label="EL2" data-label-drag="EL2" style="cursor:move">EL2</text>
        <circle cx="700" cy="564" r="3" fill="#f9fbff" stroke="#41556b" stroke-width="1.2" class="pin" data-pin="EL2:1"/><circle cx="700" cy="636" r="3" fill="#f9fbff" stroke="#41556b" stroke-width="1.2" class="pin" data-pin="EL2:2"/>
        
        
