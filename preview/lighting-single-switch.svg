<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 830" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <pattern id="gridMinor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#dfe9f6" stroke-width="1"/>
    </pattern>
    <pattern id="gridMajor" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#gridMinor)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#cddcf0" stroke-width="1.2"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1b2a3a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1280" height="830" fill="#f9fbff"/>
  <rect x="0" y="0" width="1280" height="830" fill="url(#gridMajor)"/>
  <g class="wires"><g class="wire" data-net="L" style="cursor:default"><g class="wire-seg" data-wire-seg="L:0" data-net="L" data-seg="0"><line x1="140" y1="90" x2="1140" y2="90" stroke="#d63a3a" stroke-width="3" stroke-linecap="round" opacity="1"/></g><g class="wire-seg" data-wire-seg="L:null" data-net="L"><line x1="420" y1="148" x2="420" y2="90" stroke="#d63a3a" stroke-width="3" stroke-linecap="round" opacity="1"/></g><circle class="junction" cx="420" cy="90" r="3.4499999999999997" fill="#d63a3a" stroke="#f9fbff" stroke-width="1" opacity="1"/></g><g class="wire" data-net="n-qf" style="cursor:default"><g class="wire-seg" data-wire-seg="n-qf:null" data-net="n-qf"><line x1="300" y1="284" x2="700" y2="284" stroke="#33475e" stroke-width="2.3" stroke-linecap="round" opacity="1"/></g><g class="wire-seg" data-wire-seg="n-qf:null" data-net="n-qf"><line x1="420" y1="212" x2="420" y2="284" stroke="#33475e" stroke-width="2.3" stroke-linecap="round" opacity="1"/></g><g class="wire-seg" data-wire-seg="n-qf:null" data-net="n-qf"><line x1="300" y1="320" x2="300" y2="284" stroke="#33475e" stroke-width="2.3" stroke-linecap="round" opacity="1"/></g><g class="wire-seg" data-wire-seg="n-qf:null" data-net="n-qf"><line x1="700" y1="320" x2="700" y2="284" stroke="#33475e" stroke-width="2.3" stroke-linecap="round" opacity="1"/></g><circle class="junction" cx="420" cy="284" r="3.4" fill="#33475e" stroke="#f9fbff" stroke-width="1" opacity="1"/><circle class="junction" cx="300" cy="284" r="3.4" fill="#33475e" stroke="#f9fbff" stroke-width="1" opacity="1"/><circle class="junction" cx="700" cy="284" r="3.4" fill="#33475e" stroke="#f9fbff" stroke-width="1" opacity="1"/></g><g class="wire" data-net="n-el1" style="cursor:default"><g class="wire-seg" data-wire-seg="n-el1:null" data-net="n-el1"><line x1="300" y1="380" x2="300" y2="564" stroke="#33475e" stroke-width="2.3" stroke-linecap="round" opacity="1"/></g></g><g class="wire" data-net="n-el2" style="cursor:default"><g class="wire-seg" data-wire-seg="n-el2:null" data-net="n-el2"><line x1="700" y1="380" x2="700" y2="564" stroke="#33475e" stroke-width="2.3" stroke-linecap="round" opacity="1"/></g></g><g class="wire" data-net="N" style="cursor:default"><g class="wire-seg" data-wire-seg="N:0" data-net="N" data-seg="0"><line x1="140" y1="740" x2="1140" y2="740" stroke="#2f6fb5" stroke-width="3" stroke-linecap="round" opacity="1"/></g><g class="wire-seg" data-wire-seg="N:null" data-net="N"><line x1="300" y1="636" x2="300" y2="740" stroke="#2f6fb5" stroke-width="3" stroke-linecap="round" opacity="1"/></g><g class="wire-seg" data-wire-seg="N:null" data-net="N"><line x1="700" y1="636" x2="700" y2="740" stroke="#2f6fb5" stroke-width="3" stroke-linecap="round" opacity="1"/></g><circle class="junction" cx="300" cy="740" r="3.4499999999999997" fill="#2f6fb5" stroke="#f9fbff" stroke-width="1" opacity="1"/><circle class="junction" cx="700" cy="740" r="3.4499999999999997" fill="#2f6fb5" stroke="#f9fbff" stroke-width="1" opacity="1"/></g></g>
  <g class="wire-labels"><text x="140" y="80" font-size="12" font-weight="600" fill="#d63a3a" text-anchor="start" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">L（相线）220V</text><text x="140" y="762" font-size="12" font-weight="600" fill="#2f6fb5" text-anchor="start" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">N（零线）</text></g>
  <g class="devices">
      <g class="dev" data-dev="QF1" style="cursor:pointer">
        <g transform="translate(420 180) rotate(0)"><line x1="0" y1="-32" x2="0" y2="-13" stroke="#182635" stroke-width="2.2" stroke-linecap="round" /><line x1="0" y1="13" x2="0" y2="32" stroke="#182635" stroke-width="2.2" stroke-linecap="round" /><circle cx="0" cy="-13" r="2.3" fill="#182635"/><g transform="rotate(-28 0 13)"><line x1="0" y1="13" x2="0" y2="-12" stroke="#182635" stroke-width="2.6" stroke-linecap="round" /></g><rect x="5" y="-19" width="7" height="7" rx="0" fill="none" stroke="#182635" stroke-width="1.2"/></g>
        
