        <circle cx="420" cy="148" r="3" fill="#f9fbff" stroke="#41556b" stroke-width="1.2" class="pin" data-pin="QF1:1"/><circle cx="420" cy="212" r="3" fill="#f9fbff" stroke="#41556b" stroke-width="1.2" class="pin" data-pin="QF1:2"/>
        
        
      </g>
